[project]
name = "nornless-ai"
version = "0.1.0"
description = "ai.nornless.com — AI 知识阶梯 + 科技情报站"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<6",
  "django-ninja>=1.3",
  "django-htmx>=1.21",
  "python-frontmatter>=1.1",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "Pygments>=2.18",
  "httpx>=0.27",
  "pyotp>=2.9",
  "qrcode>=8.0",
  "Pillow>=11.0",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "whitenoise>=6.8",
  "djlint>=1.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=5.0",
  "factory-boy>=3.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "django-stubs>=5.1",
]
postgres = [
  "psycopg[binary]>=3.2",
  "procrastinate[django]>=2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["app"]
testpaths = ["app/tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
mypy_path = "app"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
