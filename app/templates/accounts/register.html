{% extends "base_site.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<section class="hero"><h1 class="serif">注册</h1><p>不登录也能读九成。注册只为进度、收藏、兑码。</p></section>
{% if error %}<div class="banner archived">{{ error }}</div>{% endif %}
<form method="post" class="card" style="padding:20px;max-width:420px">{% csrf_token %}
  <p><label>邮箱<br><input name="email" type="email" required style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg)"></label></p>
  <p style="margin-top:8px"><label>称呼<br><input name="display_name" maxlength="40" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg)"></label></p>
  <p style="margin-top:8px"><label>密码（≥ 10）<br><input name="password" type="password" required minlength="10" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg)"></label></p>
  <button class="btn" style="margin-top:16px" type="submit">注册并登录</button>
</form>
{% endblock %}
