{% extends "base_site.html" %}
{% block title %}没有后台权限{% endblock %}
{% block content %}
<section class="hero">
  <h1 class="serif">这是员工后台</h1>
  <p>{% if user.is_authenticated %}当前账号 {{ user.email }} 是读者，进不了 Studio / 运营。{% else %}请用站长邮箱登录。{% endif %}</p>
  <div class="row">
    {% if user.is_authenticated %}
    <form method="post" action="/logout">{% csrf_token %}
      <input type="hidden" name="next" value="/login?staff=1&amp;next={{ next|default:'/admin/' }}">
      <button class="btn" type="submit">退出并改登员工</button>
    </form>
    {% else %}
    <a class="btn" href="/login?staff=1&amp;next={{ next|default:'/admin/' }}">员工登录</a>
    {% endif %}
    <a class="btn secondary" href="/">回首页</a>
  </div>
</section>
{% endblock %}
