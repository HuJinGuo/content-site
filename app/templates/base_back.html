{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}后台 · ai.nornless.com{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'nornless.css' %}">
  <link rel="stylesheet" href="{% static 'components.css' %}">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script src="{% static 'vendor/htmx.min.js' %}" nonce="{{ csp_nonce }}" defer></script>
  <script src="{% static 'vendor/alpine.min.js' %}" nonce="{{ csp_nonce }}" defer></script>
  <script src="{% static 'js/site.js' %}" nonce="{{ csp_nonce }}" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="brand-mark"></span>
      <span>
        <div>{% block side_title %}Studio{% endblock %}</div>
        <div class="muted small">ai.nornless.com</div>
      </span>
    </div>
    {% block sidenav %}{% endblock %}
    <div class="side-foot">
      <span>{{ user.email }}</span>
      <a href="/">← 前台</a>
      <form method="post" action="/logout">{% csrf_token %}<button class="btn small" type="submit">退出</button></form>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <span class="muted small">书页后台 · 金线令牌</span>
      <div class="grow"></div>
      <button class="icon-btn" type="button" data-theme-toggle>浅色</button>
    </div>
    <main class="container{% block main_class %}{% endblock %}" style="max-width:1100px">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
