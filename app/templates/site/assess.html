{% extends "base_site.html" %}
{% block title %}选路测评{% endblock %}
{% block content %}
<section class="hero">
  <span class="kicker">2 分钟</span>
  <h1 class="serif">这周想先解决什么？</h1>
  <p>可跳过任何一题。结果只是一篇建议，不是课表。</p>
</section>
<form method="post" class="card" style="padding:20px">{% csrf_token %}
  <p><b>这周最想做成哪件？</b></p>
  <p><label><input type="radio" name="goal" value="understand"> 搞懂别人在说什么</label></p>
  <p><label><input type="radio" name="goal" value="choose"> 会选型、估得出账单</label></p>
  <p><label><input type="radio" name="goal" value="ship"> 做出一个能交差的文档问答</label></p>
  <p><label><input type="radio" name="goal" value="agent"> 把重复劳动变成 Agent</label></p>
  <p style="margin-top:16px"><b>每周能拿出多少时间？</b></p>
  <p><label><input type="radio" name="time" value="1"> &lt; 2 小时</label></p>
  <p><label><input type="radio" name="time" value="2"> 2–5 小时</label></p>
  <p><label><input type="radio" name="time" value="3"> 5 小时以上</label></p>
  <button class="btn" type="submit" style="margin-top:16px">看建议</button>
</form>
{% endblock %}
